version: "1"
name: pr-review
description: Five Gemini specialists with separate Daytona sandboxes and one synthesizer

input:
  adapter: github_pr
  triggers:
    events: ["opened", "synchronize", "reopened", "ready_for_review"]
    comment_command: "/mochi review"
    ignore_drafts: true

repo_overrides:
  enabled: true
  path: ".mochi/config.yaml"
  allow_custom_prompts: true
  allow_custom_images: true # Owner-run private repositories only: lets a repo select its language snapshot via .mochi/config.yaml (e.g. mochi-review-java for BioCold Nexus). Revisit before opening Mochi to untrusted repositories.

sandbox:
  provider: daytona
  default_snapshot: "mochi-review-go"
  # Each specialist prepares its own container sandbox at the same PR commit.
  fork_from_base: false
  setup_timeout: 3m

agents:
  - role: correctness
    prompt_file: "configs/prompts/correctness.md"
    llm:
      provider: gemini
      model: gemini-hydrogen
      reasoning_effort: high
      max_output_tokens: 8192
    sandbox:
      enabled: true
    tools: ["read_file", "list_dir", "search_code", "git_diff", "exec_command", "submit_output"]
    budgets:
      max_turns: 15
      max_tokens: 120000
      command_timeout: 60s
      run_timeout: 5m

  - role: security
    prompt_file: "configs/prompts/security.md"
    llm:
      provider: gemini
      model: gemini-hydrogen
      reasoning_effort: high
      max_output_tokens: 8192
    sandbox:
      enabled: true
    tools: ["read_file", "list_dir", "search_code", "git_diff", "exec_command", "submit_output"]
    budgets:
      max_turns: 15
      max_tokens: 120000
      command_timeout: 60s
      run_timeout: 5m

  - role: performance-architecture
    prompt_file: "configs/prompts/performance_architecture.md"
    llm:
      provider: gemini
      model: gemini-carbon
      reasoning_effort: medium
      max_output_tokens: 8192
    sandbox:
      enabled: true
    tools: ["read_file", "list_dir", "search_code", "git_diff", "exec_command", "submit_output"]
    budgets:
      max_turns: 12
      max_tokens: 150000
      command_timeout: 60s
      run_timeout: 5m

  - role: maintainability
    prompt_file: "configs/prompts/maintainability.md"
    llm:
      provider: gemini
      model: gemini-carbon
      reasoning_effort: medium
      max_output_tokens: 8192
    sandbox:
      enabled: true
    tools: ["read_file", "list_dir", "search_code", "git_diff", "exec_command", "submit_output"]
    budgets:
      max_turns: 12
      max_tokens: 150000
      command_timeout: 60s
      run_timeout: 5m

  - role: test-runner
    prompt_file: "configs/prompts/test_runner.md"
    llm:
      provider: gemini
      model: gemini-carbon
      reasoning_effort: medium
      max_output_tokens: 8192
    sandbox:
      enabled: true
    tools: ["read_file", "write_file", "list_dir", "search_code", "git_diff", "exec_command", "submit_output"]
    budgets:
      max_turns: 20
      max_tokens: 150000
      command_timeout: 180s
      run_timeout: 8m

synthesizer:
  prompt_file: "configs/prompts/synthesizer.md"
  llm:
    provider: gemini
    model: gemini-carbon
    reasoning_effort: medium
    max_output_tokens: 8192
  budgets:
    max_turns: 3
    max_tokens: 40000
    run_timeout: 2m

output:
  sinks:
    - type: github_pr_review
      post_inline_comments: true
      include_coverage_summary: true
      min_severity: "low"
      min_confidence: 0.7
      verdict_mode: "comment_only"
