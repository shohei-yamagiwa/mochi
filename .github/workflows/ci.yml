name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build deployment image
        run: docker build -t mochi:ci .
      - name: Validate repository workflows with container binary
        run: docker run --rm -v "${{ github.workspace }}/.mochi:/app/.mochi:ro" mochi:ci validate .mochi/workflows/pr-review.yaml .mochi/workflows/pr-review-small.yaml
      - name: Build Go review sandbox image
        run: docker build -f deploy/sandbox/go.Dockerfile -t mochi:sandbox-go .
      - name: Verify sandbox toolchain
        run: docker run --rm mochi:sandbox-go sh -c 'go version && git --version && rg --version'
