name: Main branch source policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

# Read event metadata only. Never check out or execute the PR's code here.
permissions: {}

jobs:
  main-source:
    name: main-source
    runs-on: ubuntu-latest
    steps:
      - name: Require develop from this repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          if [[ "$HEAD_BRANCH" != "develop" || "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            echo "::error::PRs targeting main must come from develop in this repository."
            exit 1
          fi
          echo "Source branch policy passed: same-repository develop -> main."
